<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="lifeos-app" content="1"><meta name="lifeos-build" content="18/11/2026 14:01">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life OS</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<meta name="theme-color" content="#8A5A35">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">


<style>html,body{margin:0;height:100%;background:#F5EDE3;color:#3a2a1e;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
@media (prefers-color-scheme:dark){html,body{background:#1d1814;color:#eadfd2}}
#ld{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;padding:16px;text-align:center}
#ld i{width:28px;height:28px;border:3px solid #c9a98a;border-top-color:#8A5A35;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#ld small{opacity:.7}#ld a{color:#8A5A35}</style></head>
<body><div id="ld"><i></i><div>Đang mở Life OS…</div><small id="ldm"></small></div>
<script>
/* Trang khởi động: lấy app từ nguồn cập nhật (GitHub) nếu có, lỗi mạng thì dùng bản đã tải lần trước, không có thì dùng bản gốc app.html */
(function () {
  var K = 'lifeos.updsrc', CN = 'lifeos-remote', CK = './__remote-app';
  var q = location.search, goc = /[?&]ban=goc\b/.test(q), src = '';
  try { src = goc ? '' : (localStorage.getItem(K) || ''); } catch (e) {}
  var ok = function (t) { return typeof t === 'string' && t.indexOf('name="lifeos-app"') > 0; };
  var msg = function (t) { var m = document.getElementById('ldm'); if (m) m.textContent = t; };
  function timeout(ms, pr) { return new Promise(function (res, rej) { var t = setTimeout(function () { rej(new Error('timeout')); }, ms); pr.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); }); }); }
  function getText(u, ms, opt) { return timeout(ms, fetch(u, opt || {})).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); }); }
  function cacheGet() { try { return caches.open(CN).then(function (c) { return c.match(CK); }).then(function (r) { return r ? r.text() : null; }).catch(function () { return null; }); } catch (e) { return Promise.resolve(null); } }
  function cachePut(t) { try { caches.open(CN).then(function (c) { return c.put(CK, new Response(t, { headers: { 'Content-Type': 'text/html; charset=utf-8' } })); }).catch(function () {}); } catch (e) {} }
  function show(t, from) {
    t = t.replace('<head>', '<head><script>window.LOS_FROM=' + JSON.stringify(from) + ';window.LOS_SRC=' + JSON.stringify(src) + ';<\/script>');
    document.open(); document.write(t); document.close();
  }
  function bundled() { return getText('app.html', 20000, { cache: 'no-cache' }).then(function (t) { if (!ok(t)) throw new Error('bad'); show(t, 'bundled'); }); }
  function fail() { msg('Không mở được app. Kiểm tra mạng rồi tải lại trang.'); document.querySelector('#ld i').style.display = 'none'; }
  if (!src) { bundled().catch(fail); return; }
  var u = src + (src.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
  getText(u, 7000, { cache: 'no-store' }).then(function (t) { if (!ok(t)) throw new Error('bad'); cachePut(t); show(t, 'remote'); })
    .catch(function () { msg('Không tải được bản mới, đang mở bản đã lưu…'); return cacheGet().then(function (t) { if (ok(t)) show(t, 'cache'); else return bundled(); }); })
    .catch(fail);
})();
</script></body></html>
